<style>

<script>
(function(){

if(typeof ty!=="string"||ty==="projects"||ty==="users"||ty==="tasks"||ty==="ftasks"){var o=opts(ty,ty==="ftasks"?(row?row.project:pre||(DB.projects[0]||{}).id):null);if(v===""&&!M.id&&ty!=="ftasks")v=ty==="projects"&&pre?pre:o.length?o[0][0]:"";if(v!==""&&!o.some(function(x){return x[0]===v}))o.push([v,v+(ty==="ftasks"||ty==="tasks"?" - "+tname(v):"")]);return h+'<select id="f_'+key+'">'+o.map(function(x){return'<option value="'+esc(x[0])+'"'+(x[0]===v?" selected":"")+'>'+esc(x[1])+'</option>'}).join("")+'</select>'}
if(ty==="area")return h+'<textarea id="f_'+key+'" rows="3">'+esc(v)+'</textarea>';
if(ty==="date"&&v==="")v=d(7);if(ty==="number"&&v==="")v=0;
return h+'<input id="f_'+key+'" type="'+(ty==="number"?"number":ty==="date"?"date":"text")+'" value="'+esc(v)+'"'+(key==="password"&&M.id?' placeholder="Leave blank to keep current"':"")+'>'}
function openM(h){$("#mb").innerHTML=h;$("#ov").hidden=false}
function closeM(){$("#ov").hidden=true;M=null}
function openForm(k,id,pre){var E=ENT[k],row=id?by(DB[E.db],id):null,fs=E.f;if(k==="tasks"&&!mgr()&&id)fs=fs.filter(function(f){return f[0]==="status"||f[0]==="progress"});
M={k:k,id:id,fs:fs};openM('<h2>'+(id?"Edit ":"Add ")+E.label+'</h2>'+fs.map(function(f){return fld(f,row,pre)}).join("")+'<div class="er" id="fe"></div><div class="acts"><button class="btn out" data-a="close">Cancel</button><button class="btn" data-a="save">Save</button></div>')}
function saveForm(){var k=M.k,E=ENT[k],v={};
M.fs.forEach(function(f){var el=$("#f_"+f[0]);v[f[0]]=el?el.value.trim():"";if(f[2]==="number")v[f[0]]=v[f[0]]===""?null:Number(v[f[0]])});
if(k==="users"&&M.id&&!v.password)delete v.password;
api(k+(M.id?"/"+M.id:""),M.id?"PATCH":"POST",v).then(load).then(function(){closeM();toast(E.label+" saved");draw()}).catch(function(e){$("#fe").textContent=e.message})}
function confirmM(t,msg,fn){M={yes:fn};openM('<h2>'+t+'</h2><p>'+msg+'</p><div class="acts"><button class="btn out" data-a="close">Cancel</button><button class="btn" data-a="yes">Yes, continue</button></div>')}
function del(k,id){var E=ENT[k];if(k==="users"&&id===S.user.id){toast("You cannot delete your own account");return}
confirmM("Delete "+E.label+"?","This cannot be undone.",function(){if(S.view==="project"&&k==="projects")S.view="projects";if(S.view==="task"&&k==="tasks")S.view="tasks";run(api(k+"/"+id,"DELETE"),E.label+" deleted")})}
function login(){var b=$("[data-a=login]");b.disabled=true;b.textContent="Signing in...";var done=function(){b.disabled=false;b.textContent="Login"};$("#le").textContent="";api("login","POST",{username:$("#lu").value.trim(),password:$("#lp").value}).then(function(j){TOKEN=j.token;try{localStorage.setItem("pw_token",TOKEN)}catch(e){}$("#le").textContent="";$("#lp").value="";S.view="dashboard";return load()}).then(function(){done();draw()}).catch(function(e){done();$("#le").textContent=e.message})}
function logout(){TOKEN="";try{localStorage.removeItem("pw_token")}catch(e){}S.user=null;draw()}
document.addEventListener("click",function(e){var t=e.target.closest("[data-a]");if(!t){if(e.target.id==="ov")closeM();return}var a=t.dataset.a,k=t.dataset.k,id=t.dataset.id;
if(a==="login")login();else if(a==="pwshow"){var lp=$("#lp");lp.type=lp.type==="password"?"text":"password";t.textContent=lp.type==="password"?"Show":"Hide"}else if(a==="logout")logout();else if(a==="go")go(t.dataset.v);else if(a==="menu")$("#side").classList.toggle("open");
else if(a==="open"){S.view=k==="projects"?"project":"task";S.id=id;S.tab="Overview";draw();window.scrollTo(0,0)}
else if(a==="add")openForm(k,null,t.dataset.pre);else if(a==="edit")openForm(k,id);else if(a==="del")del(k,id);
else if(a==="close")closeM();else if(a==="save")saveForm();else if(a==="yes"){var f=M.yes;closeM();f()}
else if(a==="per"){S.per=t.dataset.v;S.from="";S.to="";draw()}else if(a==="grp"){S.open[t.dataset.g]=!S.open[t.dataset.g];draw()}else if(a==="tab"){S.tab=t.dataset.v;draw()}
else if(a==="tsave"||a==="tdone"){run(api("tasks/"+S.id,"PATCH",{status:a==="tdone"?"Completed":$("#ts").value,progress:Number($("#tp").value)}),"Task updated")}
else if(a==="tupd"){run(api("tasks/"+S.id+"/updates","POST",{note:$("#un").value}),"Update added")}
else if(a==="bell"){var al=alerts();openM('<h2>Notifications</h2><ul class="ls">'+(al.map(function(r){return'<li>'+esc(r[0])+'<small>'+esc(r[1])+'</small></li>'}).join("")||"<li>You are all caught up.</li>")+'</ul><div class="acts"><button class="btn" data-a="close">Close</button></div>')}
else if(a==="sname"){run(api("me","PATCH",{name:$("#sn").value}),"Profile saved")}
else if(a==="spw"){api("me/password","POST",{current:$("#cp").value,next:$("#np").value}).then(load).then(function(){toast("Password updated");draw()}).catch(function(e){$("#pe").textContent=e.message})}
else if(a==="reset")confirmM("Reset sample data?","All your changes will be replaced by the original sample data.",function(){S.view="dashboard";run(api("reset","POST"),"Sample data restored")})});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&(e.target.id==="lu"||e.target.id==="lp"))login();if(e.key==="Escape")closeM()});
document.addEventListener("change",function(e){if(e.target.id==="sf"){S.f=e.target.value;draw()}
if(e.target.id==="f_project"&&M&&M.k==="failures"){var ft=$("#f_task");if(ft)ft.innerHTML=opts("ftasks",e.target.value).map(function(x){return'<option value="'+esc(x[0])+'">'+esc(x[1])+'</option>'}).join("")}
if(e.target.id==="pf"||e.target.id==="pt"){var r=prange();S.from=e.target.id==="pf"?e.target.value:r[0];S.to=e.target.id==="pt"?e.target.value:r[1];S.per="custom";draw()}});
document.addEventListener("input",function(e){var id=e.target.id;if(id==="q"||id==="dq"){if(id==="q")S.q=e.target.value;else S.dq=e.target.value;draw();var q=$("#"+id);if(q){q.focus();try{q.setSelectionRange(q.value.length,q.value.length)}catch(x){}}}});
fetch("/api/health").then(function(r){return r.json()}).then(function(h){if(h&&h.persistent===false){$("#lw").textContent=WARN;$("#lw").hidden=false}}).catch(function(){});
if(TOKEN)load().then(draw).catch(function(){S.user=null;draw()});else draw();
})();
</script></body></html>
